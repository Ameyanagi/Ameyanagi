name: Metrics
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ameyanagi
          commits_authoring: Ameyanagi, ryuichi@ameyanagi.com, 77273474+Ameyanagi@users.noreply.github.com
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Tokyo
          repositories_forks: no

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ameyanagi
          commits_authoring: Ameyanagi, ryuichi@ameyanagi.com, 77273474+Ameyanagi@users.noreply.github.com
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, scss, less, dockerfile, makefile, shell, nix
          config_timezone: Asia/Tokyo
          repositories_forks: no
